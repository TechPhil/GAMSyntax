<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAM syntax viewer</title>
<style>
:root{
  --bg:#eef1f4; --panel:#fbfcfd; --ink:#18222c; --muted:#5a6a78; --rule:#d3dae1; --hover:#e6ebf0; --sel:#dfe7fb;
  --accent:#2547c9; --warn:#a4380f; --line:#334455;
  --term-bg:#fff2cf; --term-stroke:#b7841c; --nt-bg:#e3e9fc; --nt-stroke:#4a63c7; --enum-stroke:#8a97a4;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151b; --panel:#171e26; --ink:#e4eaf0; --muted:#93a3b2; --rule:#29333e; --hover:#202a35; --sel:#1f2d52;
    --accent:#8ea6ff; --warn:#ff9a6b; --line:#8da1b3;
    --term-bg:#3a3015; --term-stroke:#c99a2e; --nt-bg:#1c2850; --nt-stroke:#6f8cff; --enum-stroke:#6b7a88;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151b; --panel:#171e26; --ink:#e4eaf0; --muted:#93a3b2; --rule:#29333e; --hover:#202a35; --sel:#1f2d52;
  --accent:#8ea6ff; --warn:#ff9a6b; --line:#8da1b3;
  --term-bg:#3a3015; --term-stroke:#c99a2e; --nt-bg:#1c2850; --nt-stroke:#6f8cff; --enum-stroke:#6b7a88;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.app{display:grid;grid-template-columns:350px minmax(0,1fr);height:100%}
.side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--rule)}
.side-head{padding:16px 16px 10px}
.side-head h1{margin:0 0 2px;font-size:17px;font-weight:650;letter-spacing:-.01em}
.src{margin:0;color:var(--muted);font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:5px 10px;font-size:13px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#10151b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#10151b}}
.tabs{display:flex;border-bottom:1px solid var(--rule);padding:0 6px}
.tab{flex:1 1 auto;min-width:0;white-space:nowrap;background:none;border:0;border-bottom:2px solid transparent;padding:8px 4px;color:var(--muted);font-size:12.5px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .n{color:var(--muted);font-weight:400;margin-left:3px;font-size:11.5px}
.tab .n.bad{color:var(--warn);font-weight:600}
.search{margin:10px 12px 6px;border:1px solid var(--rule);background:var(--bg);border-radius:6px;padding:6px 9px;width:calc(100% - 24px);box-sizing:border-box}
.list{flex:1;min-height:0;overflow:auto;padding:0 6px 14px}
.grp{margin:12px 8px 4px;color:var(--muted);font-size:12px;font-weight:600}
.item{display:block;width:100%;text-align:left;border:0;background:none;padding:4px 8px;border-radius:5px;font-family:var(--mono);font-size:12px;line-height:1.35;overflow-wrap:anywhere}
.item:hover{background:var(--hover)}
.item[aria-current="true"]{background:var(--sel)}
.item .x{color:var(--muted)}
.issue-h{margin:14px 8px 4px;font-size:13px;font-weight:600}
.issue-note{margin:2px 8px 6px;color:var(--muted);font-size:12.5px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto}
.bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--rule)}
.bar label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.bar input[type=range]{width:130px}
.bar .sp{flex:1}
.zoom{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:13px}
.zoom .btn{padding:3px 9px}
.content{padding:20px 20px 40px;max-width:100%}
.content h2{margin:0;font-family:var(--mono);font-size:16px;font-weight:600;overflow-wrap:anywhere}
.meta{margin:4px 0 12px;color:var(--muted);font-size:13px}
pre.syntax{margin:0 0 16px;padding:10px 12px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.canvas{overflow-x:auto;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:6px}
.rnote{margin:-8px 0 14px;padding:0 2px;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.card .rnote{margin:6px 12px 0}
.def-h{margin:14px 0 6px;color:var(--muted);font-size:13px}
.refs{margin:18px 0 0}
.refs h3,.drawer h3{margin:0 0 8px;font-size:13px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--nt-stroke);background:var(--nt-bg);border-radius:4px;padding:2px 8px;font:12px var(--mono)}
.chip.undef{border-style:dashed;border-color:var(--warn);background:none;color:var(--warn)}
.drawer{margin-top:24px}
.card{margin:0 0 14px;border:1px solid var(--rule);border-radius:8px;background:var(--panel);overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--rule)}
.card-h b{font:600 13px var(--mono);flex:1;overflow-wrap:anywhere}
.card-h .btn{padding:2px 8px;font-size:12px}
.card .canvas{border:0;border-radius:0}
.card pre.syntax{margin:8px 12px 0;font-size:11.5px}
.xq{width:100%;box-sizing:border-box;margin:4px 0 14px;padding:11px 14px;font:15px var(--mono);background:var(--panel);color:var(--ink);border:1.5px solid var(--nt-stroke);border-radius:8px}
.xq::placeholder{color:var(--muted)}
.xhead{margin:16px 0 8px;font-size:13px;font-weight:600}
.xhead .n{color:var(--muted);font-weight:400;margin-left:6px}
.chip.kw{border-color:var(--term-stroke);background:var(--term-bg);border-radius:12px;padding:3px 10px}
.chip .cnt{color:var(--muted);margin-left:6px;font-size:11px}
.chip:hover{filter:brightness(.96)}
.xmatches{display:flex;flex-direction:column;align-items:flex-start;gap:1px;max-height:240px;overflow:auto;padding:4px;border:1px solid var(--rule);border-radius:8px;background:var(--panel);width:100%;box-sizing:border-box}
.xmatches .item{width:auto;max-width:100%}
.xmatches .item .ok{color:var(--accent);margin-left:6px;font-family:var(--sans);font-size:11.5px}
.xmore{background:none;border:0;color:var(--accent);padding:4px 2px;font-size:13px}
.notice{padding:14px 16px;border:1px solid var(--rule);border-radius:8px;background:var(--panel);max-width:70ch}
.notice p{margin:0 0 8px}
.status{min-height:18px;margin:8px 0 0;color:var(--warn);font-size:13px}
.uses{display:flex;flex-direction:column;gap:2px;margin-top:8px;align-items:flex-start}
.ebnf{width:100%;min-height:60vh;box-sizing:border-box;font:12px/1.5 var(--mono);background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:12px;resize:vertical}

.panel{display:none;position:fixed;inset:0;z-index:10;background:rgba(10,14,18,.55);align-items:center;justify-content:center;padding:20px}
.panel.on{display:flex}
.panel-box{width:min(720px,100%);background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:16px}
.panel-box h2{margin:0 0 6px;font-size:16px}
.panel-box textarea{width:100%;height:46vh;box-sizing:border-box;font:12px/1.5 var(--mono);background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:10px}

svg.rr{display:block}
.rr-line{fill:none;stroke:var(--line);stroke-width:1.6}
.rr-dot{fill:var(--line)}
.rr-end{fill:none;stroke:var(--line);stroke-width:2}
.rr text{font:13px "ui-monospace",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:var(--ink)}
.rr-term rect{fill:var(--term-bg);stroke:var(--term-stroke);stroke-width:1.3}
.rr-nt rect{fill:var(--nt-bg);stroke:var(--nt-stroke);stroke-width:1.3}
.rr-nt{cursor:pointer}
.rr-nt:hover rect{stroke-width:2.4}
.rr-enum rect{fill:none;stroke:var(--enum-stroke);stroke-dasharray:4 3}
.rr-enum text.rr-enum-title{fill:var(--muted);font-family:var(--sans);font-size:12px}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,40%) minmax(0,1fr)}
  .side{border-right:0;border-bottom:1px solid var(--rule)}
  .bar,.content{padding-left:14px;padding-right:14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-head">
      <h1>GAM syntax viewer</h1>
      <p class="src" id="src"></p>
      <div class="row">
        <button class="btn primary" id="openBtn" type="button">Open GAM file</button>
        <button class="btn" id="pasteBtn" type="button">Paste text</button>
        <input type="file" id="file" hidden accept=".txt,.md,.bnf,.text,text/*">
      </div>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <input class="search" id="q" type="search" placeholder="Filter, e.g. print users" aria-label="Filter">
    <div class="list" id="list"></div>
  </aside>
  <main class="main" id="main">
    <div class="bar" id="bar"></div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Paste GAM syntax">
  <div class="panel-box">
    <h2>Paste the GAM syntax text</h2>
    <p class="src">Everything stays in your browser.</p>
    <textarea id="paste" spellcheck="false"></textarea>
    <div class="row">
      <button class="btn primary" id="pasteGo" type="button">Parse and view</button>
      <button class="btn" id="pasteCancel" type="button">Cancel</button>
    </div>
  </div>
</div>

<script>
/* ===== GAM BNF core: tokenizer, parser, railroad layout, EBNF export ===== */
var tw = function (s) { return s.length * 7.6; }; // replaced by canvas measure in the browser

var NT_RE = /^<[A-Za-z][A-Za-z0-9_\/ .\-]*>/;
var META = '[]()|*+';

function tokenize(s) {
  var toks = [], i = 0, n = s.length;
  function ws(ch) { return ch === undefined || /\s/.test(ch); }
  while (i < n) {
    var c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    var sp = i === 0 || /\s/.test(s[i - 1]);
    if (META.indexOf(c) >= 0) {
      toks.push({ k: c, sp: sp, nsp: ws(s[i + 1]) });
      i++; continue;
    }
    if (c === '<') {
      var m = NT_RE.exec(s.slice(i, i + 120));
      if (m) {
        toks.push({ k: 'nt', v: m[0].slice(1, -1).trim(), sp: sp, nsp: ws(s[i + m[0].length]) });
        i += m[0].length; continue;
      }
    }
    if (c === '"' || c === "'") {
      var nx = s[i + 1], pv = s[i - 1];
      if (nx === '<' || nx === '(' ||
          (pv && '*)>+'.indexOf(pv) >= 0 && (nx === undefined || /\s/.test(nx) || '|)]'.indexOf(nx) >= 0))) {
        i++; continue; // quote that merely wraps a list expression
      }
    }
    var j = i;
    while (j < n && !/\s/.test(s[j]) && META.indexOf(s[j]) < 0 &&
           !(s[j] === '<' && NT_RE.test(s.slice(j, j + 120)))) j++;
    if (j === i) j = i + 1;
    toks.push({ k: 'w', v: s.slice(i, j), sp: sp, nsp: ws(s[j]) });
    i = j;
  }
  return toks;
}

function mkSeq(items) {
  if (!items.length) return null;
  return items.length === 1 ? items[0] : { t: 'seq', items: items };
}
function mkChoice(items) {
  items = items.filter(Boolean);
  if (!items.length) return null;
  return items.length === 1 ? items[0] : { t: 'choice', items: items };
}

function parseExpr(s, warn) {
  var toks = tokenize(s), p = 0;
  warn = warn || function () {};
  function parseItem() {
    var t = toks[p], node;
    if (t.k === '[') {
      p++;
      var inner = parseAlts(1);
      if (toks[p] && toks[p].k === ']') p++; else warn('missing ]');
      node = { t: 'opt', item: inner || { t: 'seq', items: [] } };
    } else if (t.k === '(') {
      p++;
      var g = parseAlts(1);
      if (toks[p] && toks[p].k === ')') p++; else warn('missing )');
      node = g || { t: 'seq', items: [] };
    } else if (t.k === 'nt') {
      node = { t: 'nt', v: t.v }; p++;
    } else {
      node = { t: 'term', v: t.v || t.k }; p++;
    }
    while (p < toks.length && (toks[p].k === '*' || toks[p].k === '+') && !toks[p].sp) {
      node = { t: toks[p].k === '*' ? 'star' : 'plus', item: node }; p++;
    }
    return node;
  }
  function parseTight() {
    var first = parseItem(), opts = [first];
    while (p + 1 < toks.length && toks[p].k === '|' && !toks[p].sp && !toks[p].nsp &&
           toks[p + 1].k !== ')' && toks[p + 1].k !== ']' && toks[p + 1].k !== '|') {
      p++; opts.push(parseItem());
    }
    return opts.length > 1 ? { t: 'choice', items: opts } : first;
  }
  function parseAlts(depth) {
    var alts = [], seq = [];
    while (p < toks.length) {
      var t = toks[p];
      if (t.k === ')' || t.k === ']') {
        if (depth > 0) break;
        warn('unmatched ' + t.k);
        seq.push({ t: 'term', v: t.k }); p++; continue;
      }
      if (t.k === '|') { alts.push(mkSeq(seq)); seq = []; p++; continue; }
      seq.push(parseTight());
    }
    alts.push(mkSeq(seq));
    return mkChoice(alts);
  }
  return parseAlts(0) || { t: 'seq', items: [] };
}

function walkNT(n, fn) {
  if (!n) return;
  if (n.t === 'nt') fn(n.v);
  else if (n.items) n.items.forEach(function (c) { walkNT(c, fn); });
  else if (n.item) walkNT(n.item, fn);
}

function cleanLine(ln) {
  // drop trailing "# comment" but keep hex colours such as #1c4587
  return ln.replace(/\s+#(?![0-9a-fA-F]{6}(?:\||\s|$)).*$/, '');
}

function cmdLabel(ast, text) {
  while (ast.t === 'choice') ast = ast.items[0]; // a stray | in the source splits the command in two; label by the first half
  var items = ast.t === 'seq' ? ast.items : [ast], out = [];
  for (var i = 0; i < items.length && out.length < 7; i++) {
    var c = items[i];
    if (c.t === 'term') out.push(c.v);
    else if (c.t === 'choice' && c.items.every(function (x) { return x.t === 'term'; })) out.push(c.items.map(function (x) { return x.v; }).join('|'));
    else if (c.t === 'nt' && i > 0 && i < 4) out.push('<' + c.v + '>');
    else break;
  }
  if (out.length < 2) { // e.g. "gam [<Select>] ...": show the first few pieces so the label means something
    var sh = function (c) { return c.t === 'term' ? c.v : c.t === 'nt' ? '<' + c.v + '>' : c.t === 'opt' ? '[' + sh(c.item) + ']' : '…'; };
    out = items.slice(0, 4).map(sh);
  }
  return out.join(' ') || text.slice(0, 40);
}

function parseDoc(text) {
  var lines = text.replace(/\r/g, '').split('\n');
  var rules = {}, ruleOrder = [], commands = [], issues = { warnings: [] };
  var section = '', sub = '', cur = null;

  function flush() {
    if (!cur) return;
    var body = cur.lines.join('\n').trim();
    var nonEmpty = cur.lines.filter(function (l) { return l.trim(); });
    if (cur.kind === 'rule' && nonEmpty.length > 1 && nonEmpty.every(function (l) { return /^\s*https?:\/\//.test(l); }))
      body = nonEmpty.map(function (l) { return l.trim(); }).join(' |\n'); // one URL pattern per line
    var warns = [];
    var ast = parseExpr(body, function (w) { warns.push(w); });
    if (cur.kind === 'rule') {
      var flat = body.replace(/\s+/g, ' ');
      if ((/^(a|an|the|any|one)\s+\S/i.test(flat) && !/[\[\]()|*+<>]/.test(flat)) || /^<[^<>]*\s[^<>]*>$/.test(flat)) {
        ast = { t: 'prose', text: flat.replace(/^<|>$/g, '') }; // a description in words, not grammar
        warns = [];
      }
      if (!rules[cur.name]) { rules[cur.name] = []; ruleOrder.push(cur.name); }
      rules[cur.name].push({ ast: ast, text: body, section: cur.section, sub: cur.sub, line: cur.line, notes: cur.notes });
      warns.forEach(function (w) { issues.warnings.push({ kind: 'rule', name: cur.name, msg: w }); });
    } else {
      var id = commands.length;
      commands.push({ id: id, label: cmdLabel(ast, body), text: body, ast: ast, section: cur.section, line: cur.line, warns: warns, notes: cur.notes });
      warns.forEach(function (w) { issues.warnings.push({ kind: 'cmd', id: id, msg: w }); });
    }
    cur = null;
  }

  for (var li = 0; li < lines.length; li++) {
    var ln = lines[li], m;
    if ((m = /^(#{1,3}) (\S.*)$/.exec(ln))) {
      flush();
      if (m[1].length === 1) { section = m[2].trim(); sub = ''; } else sub = m[2].trim();
      continue;
    }
    if (/^#/.test(ln)) continue; // commented-out line, keep current block
    if (/^\s*$/.test(ln)) { flush(); continue; }
    if ((m = /^<([A-Za-z][^<>]*)>\s*:{0,2}=\s*(.*)$/.exec(ln))) {
      flush();
      cur = { kind: 'rule', name: m[1].trim(), lines: [cleanLine(m[2])], notes: [], section: section, sub: sub, line: li + 1 };
      continue;
    }
    if (/^(gam|stam)(\s|$)/.test(ln)) {
      flush();
      cur = { kind: 'cmd', lines: [cleanLine(ln)], notes: [], section: section, line: li + 1 };
      continue;
    }
    if (/^\s+\S/.test(ln)) {
      if (cur) {
        if (/^\s*(See:|Must match|Maximum of|<[^<>]+>\s+(must|can|may|is|are)\b)/.test(ln)) cur.notes.push(ln.trim()); // prose, not grammar
        else cur.lines.push(cleanLine(ln));
      }
      continue;
    }
    flush(); // unindented prose
  }
  flush();

  var refs = {}, dups = [];
  function note(name, where) { (refs[name] = refs[name] || []).push(where); }
  function lev(a, b) {
    var p = [], i, j;
    for (j = 0; j <= b.length; j++) p[j] = j;
    for (i = 1; i <= a.length; i++) { var prev = p[0]; p[0] = i; for (j = 1; j <= b.length; j++) { var t = p[j]; p[j] = Math.min(p[j] + 1, p[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; } }
    return p[b.length];
  }
  ruleOrder.forEach(function (name) {
    rules[name].forEach(function (d) { walkNT(d.ast, function (v) { note(v, { kind: 'rule', name: name, line: d.line }); }); });
    var uniq = {};
    rules[name].forEach(function (d) { uniq[d.text.replace(/\s+/g, ' ')] = 1; });
    if (rules[name].length > 1) dups.push({ name: name, count: rules[name].length, identical: Object.keys(uniq).length === 1, lines: rules[name].map(function (d) { return d.line; }) });
  });
  commands.forEach(function (c) { walkNT(c.ast, function (v) { note(v, { kind: 'cmd', id: c.id, line: c.line }); }); });
  var undef = Object.keys(refs).filter(function (v) { return !rules[v]; })
    .map(function (v) {
      var best = null, bd = 99, lv = v.toLowerCase();
      ruleOrder.forEach(function (n) {
        var d = lev(lv, n.toLowerCase());
        if (d < bd) { bd = d; best = n; }
      });
      var lim = v.length >= 8 ? 2 : 1;
      var lines = refs[v].map(function (u) { return u.line; }).sort(function (a, b) { return a - b; });
      return { name: v, uses: refs[v], suggest: bd <= lim ? best : null, line: lines[0] };
    })
    .sort(function (a, b) { return b.uses.length - a.uses.length; });
  issues.undef = undef; issues.dups = dups;
  return { rules: rules, ruleOrder: ruleOrder, commands: commands, issues: issues };
}

/* ===== railroad layout ===== */
var GAP = 14, R = 10;
function f(n) { return Math.round(n * 10) / 10; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function hline(x1, x2, y) { return x2 > x1 ? 'M' + f(x1) + ' ' + f(y) + 'H' + f(x2) : ''; }

function nSkip() { return { w: 0, up: 0, down: 0, path: function () { return ''; }, draw: function () { return ''; } }; }

function nTerm(v) {
  var w = Math.max(26, tw(v) + 22);
  return { w: w, up: 13, down: 13, kind: 'term', v: v,
    path: function () { return ''; },
    draw: function (x, y) {

      doc.commands.forEach(function (c) {
        var hay = (c.label + ' ' + c.text).toLowerCase();
        if (terms.length && !terms.every(function (t) { return hay.indexOf(t) >= 0; })) return;
        if (c.section !== last) { h += '<div class="grp">' + esc(c.section || 'Commands') + '</div>'; last = c.section; }
        h += '<button class="item" data-cmd="' + c.id + '"' + (cur && cur.t === 'cmd' && cur.id === c.id ? ' aria-current="true"' : '') + '>' + esc(c.label) + '</button>';
        shown++;
      });
      if (!shown) h = '<p class="issue-note">No commands match.</p>';
    } else if (tab === 'rule') {
      var names = doc.ruleOrder.slice().sort(function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : 1; }), n2 = 0;
      names.forEach(function (nm) {
        if (terms.length && !terms.every(function (t) { return nm.toLowerCase().indexOf(t) >= 0; })) return;
        var c = doc.rules[nm].length;
        h += '<button class="item" data-rule="' + esc(nm) + '"' + (cur && cur.t === 'rule' && cur.name === nm ? ' aria-current="true"' : '') + '>' + esc('<' + nm + '>') + (c > 1 ? ' ' + pill('×' + c) : '') + '</button>';
        n2++;
      });
      if (!n2) h = '<p class="issue-note">No rules match.</p>';
    } else if (tab === 'x') {
      h = '<p class="issue-note">Type the start of a command in the box on the right. The words that can legally come next appear as you type, along with every command that is still possible.</p><p class="issue-note">Click a word to add it. Press Tab to accept the only suggestion.</p>';
    } else {
      var I = doc.issues;
      var typos = I.undef.filter(function (u) { return u.suggest; }), others = I.undef.filter(function (u) { return !u.suggest; });
      function undefBtn(u) {
        return '<button class="item" data-undef="' + esc(u.name) + '"' + (cur && cur.t === 'undef' && cur.name === u.name ? ' aria-current="true"' : '') + '>' + esc('<' + u.name + '>') +
          (u.suggest ? ' ' + pill('did you mean <' + u.suggest + '>?') : '') + ' ' + pill('line ' + u.line + ', ' + u.uses.length + (u.uses.length === 1 ? ' use' : ' uses')) + '</button>';
      }
      h += '<div class="issue-h">Likely typos (' + typos.length + ')</div>';
      h += '<p class="issue-note">Used but never defined, and spelled almost like a rule that is. Fix these first.</p>';
      typos.forEach(function (u) { h += undefBtn(u); });
      h += '<div class="issue-h">Never defined (' + others.length + ')</div>';
      h += '<p class="issue-note">No close match anywhere. Many are implicit primitives such as Integer or FilePath. Strict tools still need a rule for each.</p>';
      others.forEach(function (u) { h += undefBtn(u); });
      h += '<div class="issue-h">Defined more than once (' + I.dups.length + ')</div>';
      I.dups.forEach(function (d) {
        h += '<button class="item" data-rule="' + esc(d.name) + '">' + esc('<' + d.name + '>') + ' ' + pill(d.count + ' definitions, ' + (d.identical ? 'identical' : 'different') + ', lines ' + d.lines.join(', ')) + '</button>';
      });
      h += '<div class="issue-h">Bracket problems (' + I.warnings.length + ')</div>';
      h += '<p class="issue-note">Unbalanced [ ] or ( ) in the source text. The diagram guesses the intent, so check the line.</p>';
      I.warnings.forEach(function (w) {
        if (w.kind === 'cmd') h += '<button class="item" data-cmd="' + w.id + '">' + esc(doc.commands[w.id].label) + ' ' + pill(w.msg + ', line ' + doc.commands[w.id].line) + '</button>';
        else h += '<button class="item" data-rule="' + esc(w.name) + '">' + esc('<' + w.name + '>') + ' ' + pill(w.msg + ', line ' + doc.rules[w.name][0].line) + '</button>';
      });
    }
    $('#list').innerHTML = h;
  }

  function diagramHTML(ast) {
    var r = renderSVG(ast, limit / zoom);
    return '<div class="canvas"><div data-w="' + Math.round(r.w) + '" data-h="' + Math.round(r.h) + '">' + r.svg + '</div></div>';
  }
  function noteHTML(notes) {
    return notes && notes.length ? '<p class="rnote">' + notes.map(esc).join('<br>') + '</p>' : '';
  }
  function applyZoom() {
    document.querySelectorAll('.canvas > div').forEach(function (d) {
      var s = d.firstChild, w = +d.dataset.w * zoom, h = +d.dataset.h * zoom;
      s.style.width = w + 'px'; s.style.height = h + 'px';
    });
  }
  function nts(ast) { var seen = {}, out = []; walkNT(ast, function (v) { if (!seen[v]) { seen[v] = 1; out.push(v); } }); return out; }

  function renderBar() {
    var h = '';
    if (view === 'ebnf') {
      h = '<button class="btn" data-view="' + (tab === 'x' ? 'explore' : 'diagram') + '" type="button">Back</button><span class="sp"></span>';
    } else {
      h = '<label>Wrap at <input type="range" id="wrap" min="500" max="3000" step="50" value="' + limit + '" aria-label="Wrap width"><span id="wrapv">' + limit + '</span></label>' +
        '<span class="zoom"><button class="btn" data-zoom="-" type="button" aria-label="Zoom out">−</button><span id="zv">' + Math.round(zoom * 100) + '%</span><button class="btn" data-zoom="+" type="button" aria-label="Zoom in">+</button></span>' +
        '<span class="sp"></span><button class="btn" data-view="ebnf" type="button">Cleaned EBNF</button>';
    }
    $('#bar').innerHTML = h;
  }

  function renderContent() {
    var el = $('#content'), h = '';
    if (view === 'ebnf') {
      if (ebnfCache === null) ebnfCache = docToEBNF(doc);
      el.innerHTML = '<h2>Cleaned EBNF</h2><p class="meta">W3C-style grammar generated from the whole file. Missing rules are stubbed so it compiles. Paste it into a railroad generator or parser.</p>' +
        '<div class="row" style="margin:0 0 10px"><button class="btn primary" id="copyE" type="button">Copy to clipboard</button></div>' +
        '<textarea class="ebnf" id="ebnfText" readonly spellcheck="false"></textarea>';
      $('#ebnfText').value = ebnfCache;
      return;
    }
    if (view === 'explore') {
      el.innerHTML = '<h2>Explore command paths</h2><p class="meta">Start typing a command. The next possible words update as you type.</p>' +
        '<input id="xq" class="xq" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="gam print users " aria-label="Type a gam command">' +
        '<div id="xres"></div>';
      $('#xq').value = xtext;
      renderExplore();
      return;
    }
    if (!sel) { el.innerHTML = '<div class="notice"><p>Nothing to show yet.</p><p>Open your GAM file or paste its text. Lines that start with gam become commands, and lines like &lt;Name&gt; ::= define rules.</p></div>'; return; }
    var ast = null;
    if (sel.t === 'cmd') {
      var c = doc.commands[sel.id];
      h += '<h2>' + esc(c.label) + '</h2><p class="meta">' + esc(c.section || 'Commands') + ', line ' + c.line + '</p>';
      h += '<pre class="syntax">' + esc(c.text.replace(/\n\s+/g, '\n    ')) + '</pre>' + noteHTML(c.notes) + diagramHTML(c.ast); ast = c.ast;
    } else if (sel.t === 'rule') {
      var defs = doc.rules[sel.name];
      h += '<h2>' + esc('<' + sel.name + '>') + '</h2><p class="meta">' + esc(defs[0].sub || defs[0].section || 'Rule') + ', line ' + defs[0].line + (defs.length > 1 ? '. Defined ' + defs.length + ' times.' : '') + '</p>';
      defs.forEach(function (d, i) {
        if (defs.length > 1) h += '<div class="def-h">Definition ' + (i + 1) + ' of ' + defs.length + ', line ' + d.line + '</div>';
        h += '<pre class="syntax">' + esc(d.text.replace(/\n\s+/g, '\n    ')) + '</pre>' + noteHTML(d.notes) + diagramHTML(d.ast);
      });
      ast = { t: 'seq', items: defs.map(function (d) { return d.ast; }) };
    } else {
      var u = doc.issues.undef.filter(function (x) { return x.name === sel.name; })[0];
      h += '<h2>' + esc('<' + sel.name + '>') + '</h2><p class="meta">Referenced but never defined' + (u && u.suggest ? '. Probably a typo for ' + esc('<' + u.suggest + '>') : '') + '</p><div class="notice"><p>Add a rule for this name, or fix the spelling at the places below, so a strict parser can compile the grammar.</p>' +
        (u && u.suggest ? '<p><button class="chip" data-rule="' + esc(u.suggest) + '" type="button">View ' + esc('<' + u.suggest + '>') + '</button></p>' : '') + '<p>Used in:</p><div class="uses">';
      var seenUse = {};
      (u ? u.uses : []).filter(function (w) { var k = w.kind + (w.kind === 'cmd' ? w.id : w.name); if (seenUse[k]) return false; seenUse[k] = 1; return true; }).slice(0, 40).forEach(function (w) {
        h += w.kind === 'cmd' ? '<button class="item" data-cmd="' + w.id + '">' + esc(doc.commands[w.id].label) + ' ' + pill('line ' + w.line) + '</button>' : '<button class="item" data-rule="' + esc(w.name) + '">' + esc('<' + w.name + '>') + ' ' + pill('line ' + w.line) + '</button>';
      });
      h += '</div></div>';
    }
    if (ast) {
      var ns = nts(ast);
      if (ns.length) {
        h += '<div class="refs"><h3>Rules used here</h3><div class="chips">' + ns.map(function (n) {
          return '<button class="chip' + (doc.rules[n] ? '' : ' undef') + '" data-open="' + esc(n) + '" title="' + (doc.rules[n] ? 'Show this rule below' : 'Never defined in this file') + '">' + esc(n) + '</button>';
        }).join('') + '</div></div>';
      }
    }
    h += '<div class="status" id="status" role="status">' + esc(status) + '</div>';
    if (open.length) {
      h += '<div class="drawer"><h3>Opened rules</h3>';
      open.forEach(function (n) {
        var defs = doc.rules[n];
        h += '<div class="card"><div class="card-h"><b>' + esc('<' + n + '>') + '</b><button class="btn" data-rule="' + esc(n) + '" type="button">Open as main</button><button class="btn" data-close="' + esc(n) + '" type="button">Close</button></div>';
        defs.forEach(function (d) { h += '<pre class="syntax">' + esc(d.text.replace(/\n\s+/g, '\n    ')) + '</pre>' + noteHTML(d.notes) + diagramHTML(d.ast); });
        h += '</div>';
      });
      h += '</div>';
    }
    el.innerHTML = h;
    applyZoom();
  }

  function renderExplore() {
    var box = $('#xres'); if (!box) return;
    var r = explore(doc, xtext), h = '', kws = r.next.filter(function (e) { return e.kind === 'kw'; }), vals = r.next.filter(function (e) { return e.kind === 'val'; });
    var nDone = r.matches.filter(function (m) { return m.done; }).length;
    if (!r.matches.length) {
      box.innerHTML = '<div class="notice"><p>No command in this file continues that way.</p><p>Check the last word, or delete it to go back one step.</p></div>';
      return;
    }
    h += '<div class="xhead">Next word<span class="n">' + kws.length + (kws.length === 1 ? ' keyword' : ' keywords') + (vals.length ? ', ' + vals.length + (vals.length === 1 ? ' value' : ' values') : '') + (nDone ? '. The command can end here.' : '') + '</span></div><div class="chips">';
    var cap = xall ? 1e9 : 60;
    kws.slice(0, cap).forEach(function (e) { h += '<button class="chip kw" data-x="' + esc(e.text) + '" type="button">' + esc(e.text) + '<span class="cnt">' + e.count + '</span></button>'; });
    vals.forEach(function (e) {
      var nm = e.text.slice(1, -1);
      h += '<button class="chip' + (doc.rules[nm] ? '' : ' undef') + '" data-open="' + esc(nm) + '" type="button" title="A value goes here. Click to see its rule.">' + esc(e.text) + '<span class="cnt">' + e.count + '</span></button>';
    });
    if (kws.length > cap) h += '<button class="xmore" data-xall="1" type="button">Show all ' + kws.length + '</button>';
    if (!kws.length && !vals.length) h += '<span class="meta">Nothing more to add.</span>';
    h += '</div>';
    h += '<div class="xhead">Matching commands<span class="n">' + r.matches.length + (r.over ? '. Some very large rules were only partly searched.' : '') + '</span></div><div class="xmatches">';
    r.matches.slice(0, 60).forEach(function (m) {
      h += '<button class="item" data-xsel="' + m.id + '"' + (xsel === m.id ? ' aria-current="true"' : '') + '>' + esc(doc.commands[m.id].label) + (m.done ? '<span class="ok">complete</span>' : '') + '</button>';
    });
    if (r.matches.length > 60) h += '<span class="meta" style="padding:4px 8px">and ' + (r.matches.length - 60) + ' more. Keep typing to narrow it down.</span>';
    h += '</div>';
    var pick = xsel !== null && r.matches.some(function (m) { return m.id === xsel; }) ? xsel : (r.matches.length === 1 ? r.matches[0].id : null);
    if (pick !== null) {
      var c = doc.commands[pick];
      h += '<div class="xhead">' + esc(c.label) + '</div><pre class="syntax">' + esc(c.text.replace(/\n\s+/g, '\n    ')) + '</pre>' + diagramHTML(c.ast);
    }
    box.innerHTML = h;
    applyZoom();
  }
  function setX(v) { xtext = v; xsel = null; var i = $('#xq'); if (i && i.value !== v) i.value = v; renderExplore(); }

  function renderAll() { renderSide(); renderBar(); renderContent(); }

  function openRule(name) {
    if (!doc.rules[name]) { status = '“' + name + '” isn’t defined in this file.'; renderContent(); return; }
    status = '';
    open = open.filter(function (n) { return n !== name; }); open.unshift(name); open = open.slice(0, 6);
    renderContent();
    var card = document.querySelector('.card'); if (card) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  document.addEventListener('click', function (e) {
    var t = e.target, b;
    if ((b = t.closest('[data-tab]'))) {
      tab = b.dataset.tab;
      if (tab === 'x') view = 'explore'; else if (view === 'explore') view = 'diagram';
      renderAll(); if (tab === 'x' && $('#xq')) $('#xq').focus(); return;
    }
    if ((b = t.closest('[data-cmd]'))) { if (tab === 'x') tab = 'cmd'; sel = { t: 'cmd', id: +b.dataset.cmd }; open = []; view = 'diagram'; status = ''; renderAll(); $('#main').scrollTop = 0; return; }
    if ((b = t.closest('[data-rule]'))) { if (tab === 'x') tab = 'cmd'; sel = { t: 'rule', name: b.dataset.rule }; open = []; view = 'diagram'; status = ''; renderAll(); $('#main').scrollTop = 0; return; }
    if ((b = t.closest('[data-undef]'))) { sel = { t: 'undef', name: b.dataset.undef }; view = 'diagram'; renderAll(); return; }
    if ((b = t.closest('[data-open]'))) { openRule(b.dataset.open); return; }
    if ((b = t.closest('.rr-nt'))) { openRule(b.getAttribute('data-nt')); return; }
    if ((b = t.closest('[data-x]'))) {
      var tok = b.dataset.x;
      setX((/\s$/.test(xtext) || !xtext ? xtext : xtext.replace(/\S+$/, '')) + tok + ' ');
      var xi = $('#xq'); if (xi) { xi.focus(); xi.setSelectionRange(xi.value.length, xi.value.length); }
      return;
    }
    if ((b = t.closest('[data-xsel]'))) { xsel = +b.dataset.xsel; renderExplore(); return; }
    if ((b = t.closest('[data-xall]'))) { xall = true; renderExplore(); return; }
    if ((b = t.closest('[data-close]'))) { open = open.filter(function (n) { return n !== b.dataset.close; }); renderContent(); return; }
    if ((b = t.closest('[data-view]'))) { view = b.dataset.view; renderBar(); renderContent(); return; }
    if ((b = t.closest('[data-zoom]'))) {
      zoom = Math.min(2, Math.max(0.4, zoom + (b.dataset.zoom === '+' ? 0.1 : -0.1)));
      renderBar(); renderContent(); return;
    }
    if (t.id === 'copyE') {
      var ta = $('#ebnfText'); ta.focus(); ta.select();
      try { navigator.clipboard.writeText(ta.value).then(function () { t.textContent = 'Copied'; }, function () { document.execCommand('copy'); t.textContent = 'Copied'; }); }
      catch (err) { try { document.execCommand('copy'); t.textContent = 'Copied'; } catch (e2) { t.textContent = 'Press Ctrl+C to copy'; } }
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { q = e.target.value; renderSide(); }
    if (e.target.id === 'xq') { xtext = e.target.value; xsel = null; clearTimeout(load.x); load.x = setTimeout(renderExplore, 40); }
    if (e.target.id === 'wrap') { limit = +e.target.value; $('#wrapv').textContent = limit; clearTimeout(load.t); load.t = setTimeout(renderContent, 120); }
  });

  $('#openBtn').addEventListener('click', function () { $('#file').click(); });
  $('#file').addEventListener('change', function (e) { readFile(e.target.files[0]); e.target.value = ''; });
  function readFile(file) {
    if (!file) return;
    var r = new FileReader();
    r.onload = function () { load(String(r.result), file.name, true); };
    r.readAsText(file);
  }
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });
  $('#pasteBtn').addEventListener('click', function () { $('#panel').classList.add('on'); $('#paste').focus(); });
  $('#pasteCancel').addEventListener('click', function () { $('#panel').classList.remove('on'); });
  $('#pasteGo').addEventListener('click', function () {
    var v = $('#paste').value; if (!v.trim()) return;
    $('#panel').classList.remove('on'); load(v, 'Pasted text', true);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') $('#panel').classList.remove('on');
    if (e.key === 'Tab' && e.target.id === 'xq' && !e.shiftKey) {
      var kw = explore(doc, e.target.value).next.filter(function (x) { return x.kind === 'kw'; });
      if (kw.length === 1) { e.preventDefault(); setX((/\s$/.test(xtext) || !xtext ? xtext : xtext.replace(/\S+$/, '')) + kw[0].text + ' '); e.target.setSelectionRange(e.target.value.length, e.target.value.length); }
    }
  });

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved && saved.length > 200) load(saved, 'Your file (remembered in this browser)', false);
  else load(SAMPLE, 'Sample excerpt, open your file to see everything', false);
})();
</script>
</body>
</html>
